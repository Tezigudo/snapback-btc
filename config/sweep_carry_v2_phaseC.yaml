# Carry v2 — Phase C tightening at 20-25x leverage.
#
# Goal: close the +54% train→test drift gap that's the only thing blocking
# carry-v2's promotion. Changes vs sweep_carry_v2.yaml:
#  - test_days: 20 → 30 (more bars per test, lower per-fold noise)
#  - min_trades_train: 3 → 6 (refuses train combos with too-few-samples
#    that almost certainly won't generalise)
#  - leverage: [20, 25]  (was hardcoded 3; the 3x cap was binding on
#    tight-SL combos, so 20-25x lets the strategy use its full risk-target
#    size — only matters when sl_dist is small. Live bot stays at 3x via
#    risk.py.)

train_days: 60
test_days: 30
step_days: 30
min_trades_train: 6

promotion:
  min_median_test_sharpe: 0.5
  min_fold_stability: 0.5
  max_train_test_drift_pct: 50

# 3 × 3 × 3 × 2 = 54 combos
grid:
  funding_threshold:   [0.0001, 0.0002, 0.0005]
  sl_pct:              [0.005, 0.010, 0.015]
  max_24h_change_pct:  [100.0, 5.0, 3.0]
  leverage:            [20, 25]
  # carried (ignored by carry):
  rsi_period:         [2]
  rsi_long_threshold: [10]
  volume_multiple:    [1.0]
  atr_tp_multiple:    [1.5]
  atr_sl_multiple:    [1.0]
  time_stop_bars:     [48]
