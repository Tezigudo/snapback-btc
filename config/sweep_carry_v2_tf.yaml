# Carry v2 TF sweep — same param grid as phaseC, runs per entry timeframe.
# Use this with --entry-tf 1h or --entry-tf 4h.
#
# Why same grid: a fair TF comparison needs the SAME strategy params at
# each TF, otherwise we're testing TF+param interaction not TF alone.
# Promotion thresholds match phaseC.

train_days: 60
test_days: 30
step_days: 30
min_trades_train: 6

promotion:
  min_median_test_sharpe: 0.5
  min_fold_stability: 0.5
  max_train_test_drift_pct: 50

# 3 × 3 × 3 × 2 = 54 combos (same as phaseC)
grid:
  funding_threshold:   [0.0001, 0.0002, 0.0005]
  sl_pct:              [0.005, 0.010, 0.015]
  max_24h_change_pct:  [100.0, 5.0, 3.0]
  leverage:            [20, 25]
  # carried (ignored by carry):
  rsi_period:         [2]
  rsi_long_threshold: [10]
  volume_multiple:    [1.0]
  atr_tp_multiple:    [1.5]
  atr_sl_multiple:    [1.0]
  time_stop_bars:     [48]
