# Donchian walk-forward sweep. Different free params than snapback.
# rsi_period etc are ignored by DonchianBreakoutBTC; they're carried in
# StrategyParams only so the sweep machinery has a consistent param shape.
# Real free params: donchian_period_entry, donchian_period_exit, atr_sl_multiple.

train_days: 60
test_days: 20
step_days: 30
min_trades_train: 5

promotion:
  min_median_test_sharpe: 0.5
  min_fold_stability: 0.5
  max_train_test_drift_pct: 50

# 3 × 2 × 2 = 12 combos
grid:
  donchian_period_entry: [20, 40, 80]
  donchian_period_exit:  [10, 20]
  atr_sl_multiple:       [1.5, 2.5]
  # carried (ignored by donchian):
  rsi_period:         [2]
  rsi_long_threshold: [10]
  volume_multiple:    [1.0]
  atr_tp_multiple:    [1.5]
  time_stop_bars:     [48]
