# Carry walk-forward sweep. Free params: funding_threshold, sl_pct.

train_days: 60
test_days: 20
step_days: 30
min_trades_train: 3

promotion:
  min_median_test_sharpe: 0.5
  min_fold_stability: 0.5
  max_train_test_drift_pct: 50

# 3 × 2 = 6 combos. Carry is so structurally constrained that more knobs
# rarely help; a tiny grid keeps walk-forward fast.
grid:
  funding_threshold: [0.0001, 0.0002, 0.0005]
  sl_pct:            [0.01, 0.02]
  # carried (ignored by carry):
  rsi_period:         [2]
  rsi_long_threshold: [10]
  volume_multiple:    [1.0]
  atr_tp_multiple:    [1.5]
  atr_sl_multiple:    [1.0]
  time_stop_bars:     [48]
