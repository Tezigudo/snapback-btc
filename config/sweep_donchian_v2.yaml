# Donchian v2 walk-forward sweep — wider period grid + ATR trailing stop.
#
# v1 result: 53% stability, +0.40 median Sharpe, +1.35% median return. Close
# to promotion but failed on Sharpe-and-drift. v2 hypothesis: a faster
# trailing stop (vs. waiting for the Donchian-exit channel to close) cuts
# the give-back on winners that don't pierce the exit band cleanly. Also
# widening the period grid lets the walk-forward pick longer channels in
# trending years vs. shorter ones in chop.

train_days: 60
test_days: 20
step_days: 30
min_trades_train: 5

promotion:
  min_median_test_sharpe: 0.5
  min_fold_stability: 0.5
  max_train_test_drift_pct: 50

# 3 × 2 × 2 × 3 = 36 combos
grid:
  donchian_period_entry: [20, 40, 80]
  donchian_period_exit:  [10, 20]
  atr_sl_multiple:       [1.5, 2.5]
  atr_trail_multiple:    [0.0, 1.5, 3.0]   # 0 = trailing OFF (v1 baseline)
  # carried (ignored by donchian):
  rsi_period:         [2]
  rsi_long_threshold: [10]
  volume_multiple:    [1.0]
  atr_tp_multiple:    [1.5]
  time_stop_bars:     [48]
