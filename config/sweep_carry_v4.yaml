# Carry v4 walk-forward — adds trend EMA gate to v3 base.
# trend_ema_period=0 keeps v3 behaviour; >0 activates the gate.
#
# Same strict promotion gate as v3 — must clear all 6 checks.

train_days: 60
test_days: 30
step_days: 30
min_trades_train: 6

promotion:
  min_median_test_sharpe: 0.5
  min_fold_stability: 0.5
  max_train_test_drift_pct: 50
  min_mean_test_return_pct: 0.5
  min_compounded_cagr_pct: 5.0
  max_single_fold_loss_pct: -15.0

# Trim grid to keep walk-forward time bounded.
# 2 × 2 × 2 × 2 × 2 × 4 = 128 combos
grid:
  funding_threshold:        [0.0001, 0.0002]
  sl_pct:                   [0.010, 0.015]
  max_24h_change_pct:       [100.0, 3.0]
  atr_percentile_threshold: [100.0, 80.0]
  dd_halt_pct:              [100.0, 10.0]
  trend_ema_period:         [0, 200, 800, 2880]   # 0=off, 200=2d, 800=8d, 2880=30d
  leverage:                 [20]
  rsi_period:         [2]
  rsi_long_threshold: [10]
  volume_multiple:    [1.0]
  atr_tp_multiple:    [1.5]
  atr_sl_multiple:    [1.0]
  time_stop_bars:     [48]
