# Tunable strategy params for multifactor-v1 (the deployable strategy).
# NOT a safety surface — see risk.py for hard ceilings.
#
# Re-locked 2026-06-02 with 4H EMA200 regime gate. See:
#   reports/LEVER1_SIGNOFF_DEPLOY.html
#   reports/MULTIFACTOR_4H_GATE_DECISION.html
#   reports/multifactor_v1_4h_gate_revalidation.json
#   reports/multifactor_4h_parity_validation.json
#   reports/multifactor_v1_4h_gate_walk_forward.json
#
# Backtest evidence: 5 OOS windows 2022 H1 – 2025 H1 at $1M cash →
# +77.9314% compounded equity (was +50.48% pre-gate). 5 of 5 windows
# positive. Worst window 2024 H2 max DD = -16.72% (kill-switch buffer
# stays at -35.5%). Walk-forward 2020-2026 (25 quarterly windows):
# 20/25 = 80% positive, +243.81% compounded. Live↔backtest parity 100%
# across 25,702 evaluated bars.
#
# Prior locked claim (2026-05-17 / pre-4H-gate / PATH2_RESULTS.html):
# +55.73% compounded across same 5 OOS, 262 trades, 4/5 wins. SUPERSEDED
# by this re-lock.
#
# DO NOT TUNE THESE VALUES WITHOUT explicit re-validation across all 5
# OOS windows + the parity harness at tools/multifactor_validate.py.

symbol: BTC/USDT:USDT

# strategy_name selects the live signal logic in bot.py.
#   "multifactor-v1" (default) — v1 RSI/vol/EMA/funding filters, fixed 1.5%/3% SL/TP.
#   "v3-all-wider-4" — v3 ported: TA confirmations (trendline/SR/Fib) + dist-ema gate
#                      + vol-regime gate + ATR-based stops (4×/8× ATR, k=4.0).
#                      Best in extended walk-forward 2020-2026: 10/12 wins at 10bps
#                      stress, 0/12 kill-switch hits. See EXTENDED_WALKFORWARD.html.
#                      Switch ONLY after stopping bot cleanly + restarting in tmux.
#                      Requires ~30 days of warm-up before vol-regime gate is valid.
strategy_name: multifactor-v1

timeframes:
  entry: 15m
  trend: 1h

strategy:
  # RSI(14) — standard period (not RSI(2)!). Asymmetric thresholds.
  rsi_period: 14
  rsi_long_threshold: 35        # buy when RSI(14) < 35 (was 40; 2026-05-29: OOS EV/trade +0.60% vs +0.35%, more robust in chop; RSI<30 worse — see snapback_v1_rsi_long_35_beats_40 memory)
  rsi_short_threshold: 70       # sell when RSI(14) > 70 (overbought within downtrend)

  # EMA on the ENTRY timeframe (15m). multifactor-v1 uses mf_trend_ema_period.
  ema_period: 200               # kept for backtest-prep warm-up sizing
  mf_trend_ema_period: 200

  # Volume confirmation: current vol > 1.5 * 20-bar SMA
  # Lowered from 2.0 (2026-07-16 frequency sweep, PR #5): the whole 1.0-1.75x
  # band beat the 2.0 baseline OOS — plateau pick, not peak-chasing — and the
  # 4H regime gate now does the low-volume regime filtering that 2.0 was
  # originally protecting against. Full metrics + fee-stress in PR #5.
  volume_ma_period: 20
  volume_multiple: 1.5

  # Funding-rate sentiment gate (refuse crowded trade direction).
  # Funding > +0.15% per 8h = extremely long-crowded → block new longs.
  # Funding < -0.15% per 8h = extremely short-crowded → block new shorts.
  # (Backport of the deployed value: relaxed 0.0005→0.0015 on 2026-07-12,
  # droplet 35bfc7b, validated +81.94%/PSR gate-clean on the 4H geometry.)
  funding_extreme_threshold: 0.0015
  require_funding_not_extreme: true

  # Snapback-v1 funding fields (unused by multifactor-v1; kept for YAML loader compat).
  funding_long_max: -0.0003
  funding_short_min: 0.0003

  # ATR fields are unused by multifactor-v1 but kept for backtest plumbing compat.
  atr_period: 20
  atr_tp_multiple: 1.5
  atr_sl_multiple: 1.0

  # Fixed % SL / TP geometry (multifactor-v1 uses these, not ATR).
  sl_pct: 0.015                 # 1.5% stop loss
  tp_pct: 0.030                 # 3.0% take profit (2:1 R:R)
  # ⚠ TWO NAMES FOR ONE CONCEPT — keep them EQUAL.
  #   max_hold_bars   ← the live bot (Bot._maybe_time_stop) and the backtest
  #                     class (DayTradeMultiFactorBTC.max_hold_bars)
  #   time_stop_bars  ← tools/data_parity_check.py and
  #                     tools/build_deployed_strategies_viz.py
  # Editing only one silently desynchronises the tools from the bot, and
  # data_parity_check falls back to 48 bars (12h) if the key is missing — so
  # neither key may be deleted. tests/test_v1_trend_exit.py pins them equal.
  time_stop_bars: 1344          # 14 days × 96 bars/day at 15m = 1344 bars
  max_hold_bars: 1344           # ← the one the LIVE BOT reads

  # Required toggles for multifactor-v1
  # Gates BOTH the entry trend filter and the adverse-trend EXIT (close when
  # price crosses back through the 15m EMA(200)). The exit half only started
  # running live on 2026-08-10 — before that this key was half-honoured, which
  # is the whole subject of MULTIFACTOR_V1_LIVE_EXIT_VERDICT.md. Flipping this
  # to false now disables both halves in live AND backtest, keeping them paired.
  require_trend: true           # close on correct side of EMA(200)
  require_candlestick: false    # disabled in production (too rare on 15m)
  require_macd: false           # disabled in production (redundant)

  # 4H EMA200 regime gate (added 2026-06-02 per LEVER1_SIGNOFF_DEPLOY.html).
  # Long entries require 15m close > 4H EMA(200) at the most-recent CLOSED
  # 4H bar; short entries mirror. Lookahead-safe alignment via merge_asof
  # on bar-close timestamps. See:
  #   strategy/signals_multifactor.py::_build_4h_ema_aligned
  #   strategy/live_multifactor_v1.py::_compute_4h_ema_at_15m_close
  # +27.45pp compounded lift vs pre-gate baseline; PSR 0.978 (only ablation
  # variant clearing evidence_of_edge per Bailey & López de Prado 2012).
  use_mtf_4h_gate: true
  mtf_4h_ema_period: 200

sizing:
  risk_per_trade_pct: 3.5       # 3.5% of equity per trade (backport of deployed value: raised 2.75→3.5 on 2026-07-12 after the sizing sweep, reports/sizing_sweep_2026.json; droplet 93076fa).
  leverage: 20                  # ceiling. Risk-based sizing → ~2.33x effective at 3.5%.
                                # risk.py MAX_LEVERAGE matches this hard ceiling.

# clientOrderId prefix — tags this leg's fills for attribution.
# `hedge.enabled` is intentionally FALSE: sub-account deploy gives true
# isolation (each bot in its own sub-account, one-way mode within each).
# Keep the prefix so fills are clearly labeled "SBV1-..." in the exchange ledger.
hedge:
  enabled: false
  client_order_id_prefix: "snap-v1-"

# Bracket re-protection (bot._maybe_reprotect). Restores an SL/TP bracket that
# vanished WITHOUT a fill — a manual cancel, or a leverage change (Binance
# auto-cancels all open orders on one). Disabled 2026-07-22 -> 08-11 because the
# old detector read only /fapi/v1/openOrders and could not see the conditional
# orders _place_brackets creates, so it re-placed until -4045. Detection now
# merges BOTH order books (bot_internals.bracket_state).
reprotect:
  enabled: true
  # ROLLOUT PHASE 2 — ARMED 2026-08-29. It now re-places a missing bracket for
  # real. Phase 1 (observe_only: true) was satisfied on 2026-08-23 by one full
  # live v1 position; this is the evidence chain, recorded here because it cannot
  # be proven by unit tests — the truth lives on the exchange:
  #   1. The bracket really existed as ALGO orders. The events row's order_ids
  #      were {entry: 1111177029564, sl: 2000001378159811, tp: 2000001378159821};
  #      the 16-digit ids are algo-book ids, exactly the shape the plain-only
  #      July detector was blind to.
  #   2. _maybe_reprotect actually RAN, every tick of the position. Proof is the
  #      call site — self._maybe_reprotect(equity) is unconditional in the tick
  #      loop, beside _detect_bracket_exit. It is NOT proven by meta.active_bracket
  #      being '', which is written in the flat branch before the meta read and so
  #      only shows the function ran while flat.
  #   3. It read both order books successfully every time. "algo book unreadable"
  #      — the abstain path — appears 0 times all-time in logs/bot.jsonl, so no
  #      read ever failed (not merely that it never looked).
  #   4. ZERO "WOULD re-place" lines across all four leg journals for the whole
  #      ~23h59m position. Combined with (2) and (3), silence means state_.intact
  #      returned true every tick — the algo-aware detector correctly saw a healthy
  #      bracket. That is the direct falsification of the July false negative.
  # ⚠️ SCOPE, AND READ THIS PRECISELY — it is THIS FILE, not "whatever v1 means".
  # Other config files are safe by construction: params_donchian.yaml and
  # params_sol_supertrend.yaml have no reprotect: key at all, and
  # rp.get("enabled", False) (bot.py) is fail-closed, so _maybe_reprotect never
  # runs on those legs. Do NOT copy this block to them without their own
  # observe-only pass — that would arm an unvalidated detector on real money.
  #
  # But this file is NOT pinned to one strategy. `strategy_name` above selects
  # the live signal logic, and bot_internals.evaluate_for_strategy has THREE
  # live dispatch paths — "multifactor-v1" (what Phase 1 ran on),
  # "v3-all-wider-4", and "donchian-v3" — so changing that line while this stays
  # false runs a strategy Phase 1 never covered, with re-placement ARMED.
  # ⚠️ "donchian-v3" is the sharpest edge of the three: it places NO TP leg, so
  # the bracket stashed at entry carries an SL only, and a re-place restores only
  # that. Nothing here has been exercised against a half-bracket.
  # ⚠️ If you change `strategy_name` in this file, set observe_only back to TRUE
  # and re-run Phase 1 for that strategy before flipping it again.
  #
  # Why this is a comment and not a code gate on strategy_name: reprotect is
  # mechanically strategy-AGNOSTIC — it re-places the bracket that
  # _place_live_entry stashed in meta.active_bracket at entry, whatever geometry
  # produced it. A hard gate would therefore silently DISABLE protection on a
  # legitimate strategy switch, which is the failure direction that actually
  # hurts. The evidence above is what is strategy-specific, so the warning
  # belongs next to the evidence.
  observe_only: false
  # Hard cap per position, persisted in meta.active_bracket so a restart cannot
  # reset it. The 60s throttle did NOT stop July, it only paced the spam.
  max_replaces_per_position: 3

execution:
  order_type: limit             # market | limit  (2026-05-19: enabled limit-order entry)
  # Limit-order knobs (used only when order_type=limit):
  #   limit_offset_bps  — places the entry limit offset_bps BELOW close for LONG,
  #                       ABOVE close for SHORT. 0 = at close. Smaller = tighter
  #                       (less slippage, lower fill probability). 1 bp ≈ $6.5
  #                       at $65k BTC.
  #   limit_timeout_s   — wait this long for the limit to fill, then cancel and
  #                       (if zero fill) market-order the full qty as fallback.
  #                       Partial fills are bracketed as-is; no market top-up.
  # Maker fee on Binance Futures USDM = 0.02% vs 0.04% taker → saves ~2 bps/side
  # when the limit fills (≈4 bps total round-trip). For multifactor-v1 at ~50
  # trades/year that's ~2%/yr edge improvement on top of strategy returns.
  limit_offset_bps: 0.0         # 0 = exactly at close; positive = further from close
  limit_timeout_s: 20.0         # cancel after N seconds, fall back to market
  poll_interval_s: 5            # main loop tick
  reconcile_on_boot: true

# Deploy gates (read by bot.py)
deploy:
  # If equity drops to this fraction of deploy_start_equity → HALT + email + flatten.
  # 0.645 = -35.5% drawdown ceiling. Widened from -18% on 2026-05-23 for combined-deploy:
  # at risk 2.75% the per-leg start-anchored DD worst-case is around -22% (v1 leg, Nov 2019),
  # so -35.5% leaves ~14pp cushion. Realistic-sim verified kill never fires.
  #
  # ^ That claim was measured on the model WITH v1's adverse-trend exit, which
  # the live bot did not run until 2026-08-10. While the gap was open it was
  # FALSE for what actually ran: 0.41% of deploy dates breached -35.5%
  # (worst -38.35%), incl. an April-2025 cluster — MULTIFACTOR_V1_LIVE_EXIT_VERDICT.md.
  # The exit is now wired live (bot_internals.strategy_uses_trend_exit), so the
  # claim and the running model agree again. Anchored to deploy-start equity,
  # NOT the running peak — peak-to-trough max DD is the wrong test for it.
  kill_switch_equity_fraction: 0.645
  # Send daily status email at this UTC hour.
  daily_status_email_hour_utc: 0
  # Warn (don't block) when starting equity is below this. Below $100 USDT,
  # exchange minimums (0.001 BTC / $50 notional) may cause frequent signal skips.
  min_capital_warn_usdt: 100.0
