# Tunable strategy params. NOT a safety surface — see risk.py for ceilings.
# Changes here should be backed by a walk-forward run.

symbol: BTC/USDT:USDT

timeframes:
  entry: 15m
  trend: 1h

strategy:
  # RSI on entry timeframe. Default RSI(2) per Connors' short-term
  # mean-reversion playbook — the strategy intent here is snap-back, and
  # RSI(14) on 15m bars smooths out exactly the spikes we want to fade.
  #
  # Bake-off on BTC perp 2025-05 → 2026-05 (3x lev, fees+slip+funding):
  #   config         trades  return%  PF    WR%   DD%    Sharpe
  #   RSI(2)  10/90    40    -10.4%   0.71  42.5  -13.6  -1.25  <- chosen
  #   RSI(14) 30/70     6     -5.0%   0.26  16.7   -6.1  -1.49  too quiet
  #   RSI(14) 35/65    14     -9.4%   0.38  21.4  -14.1  -1.50
  #   RSI(14) 40/60    35    -18.5%   0.47  31.4  -21.0  -2.22  worst
  # RSI(2) wins on every quality metric (PF, WR, Sharpe) at every matched
  # signal density. P3 walk-forward will sweep rsi_period as a free param.
  rsi_period: 2
  rsi_long_threshold: 10        # buy when RSI(2) < 10
  rsi_short_threshold: 90       # sell when RSI(2) > 90

  # EMA(200) on trend timeframe
  ema_period: 200

  # Relative volume filter
  volume_ma_period: 20
  volume_multiple: 1.5          # current vol > 1.5 * SMA(20)

  # Funding rate filter (per 8h, decimal). The 2025-2026 regime has compressed
  # funding to ±0.01% so the original ±0.03% gate triggered zero bars. We
  # relax to ±0.005% ("funding not strongly against direction") and treat
  # funding more as a cost than a hard gate. P3 walk-forward retunes per fold.
  funding_long_max: 0.00005     # long allowed unless funding > +0.005%
  funding_short_min: -0.00005   # short allowed unless funding < -0.005%

  # ATR-based exits on trend timeframe
  atr_period: 20
  atr_tp_multiple: 1.5          # TP at +1.5 * ATR
  atr_sl_multiple: 1.0          # SL at -1.0 * ATR (1.5:1 R:R)
  time_stop_bars: 48            # bars on entry TF (48 * 15m = 12h)

sizing:
  risk_per_trade_pct: 2.0       # 2% of equity per trade (fixed-fractional)
  leverage: 3                   # request leverage; risk.py caps at MAX_LEVERAGE
                                # P3.4 ablation proved 20x adds no edge for
                                # carry-v2; 3x is the right answer.

execution:
  order_type: market            # market | limit
  poll_interval_s: 5            # main loop tick
  reconcile_on_boot: true
