# Carry v2 phaseC ABLATION at 3x leverage only.
# Tests whether the phaseC promotion pass came from leverage (20-25x) or
# from the tighter test windows + min_trades. Same param grid as phaseC
# except leverage is fixed at the original 3x cap.

train_days: 60
test_days: 30
step_days: 30
min_trades_train: 6

promotion:
  min_median_test_sharpe: 0.5
  min_fold_stability: 0.5
  max_train_test_drift_pct: 50

# 3 × 3 × 3 × 1 = 27 combos
grid:
  funding_threshold:   [0.0001, 0.0002, 0.0005]
  sl_pct:              [0.005, 0.010, 0.015]
  max_24h_change_pct:  [100.0, 5.0, 3.0]
  leverage:            [3]
  rsi_period:         [2]
  rsi_long_threshold: [10]
  volume_multiple:    [1.0]
  atr_tp_multiple:    [1.5]
  atr_sl_multiple:    [1.0]
  time_stop_bars:     [48]
