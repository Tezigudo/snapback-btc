[project]
name = "snapback-btc"
version = "0.0.1"
description = "Deterministic Binance Futures BTC perp bot — RSI(2) + EMA(200) + volume + funding."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "ccxt>=4.4.0",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b0",
    "numpy>=1.26.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "plotly>=5.24.0",
    "requests>=2.32.0",
    "pyarrow>=17.0.0",
    "backtesting>=0.3.3",
]

[project.optional-dependencies]
research = [
    "jupyterlab>=4.2.0",
    "matplotlib>=3.9.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strategy", "exchange"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
